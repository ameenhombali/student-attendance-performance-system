<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Student Attendance & Academic Performance Management System</title>
    <meta name="description" content="College mini project: Real-time Attendance & Performance Management Web Application for Students & Faculty">
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- App Styles -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/tables.css">
</head>
<body>

    <!-- Main Single Page Application Host Container -->
    <div id="app"></div>

    <!-- Reusable Modal Dialog Overlay -->
    <div class="modal-overlay" id="app-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title">Details</h3>
                <button class="close-modal-btn" id="close-modal-btn">&times;</button>
            </div>
            <div id="modal-body">
                <!-- Injected via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Toast Popup Notifications Anchor -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Application Script Modules -->
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/student.js"></script>
    <script src="js/faculty.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
